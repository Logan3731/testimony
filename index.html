<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>증언 — 추리 게임</title>
<meta name="description" content="용의자들이 한마디씩 한다. 범인은 반드시 거짓말을 한다.">
<meta name="theme-color" content="#14100c">
<meta property="og:title" content="증언 — Testimony">
<meta property="og:description" content="용의자들이 한마디씩 한다. 범인은 반드시 거짓말을 한다.">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#14100c; --panel:#1e1913; --panel2:#2a231a; --line:#3b3227;
    --tx:#ece4d6; --tx2:#9a8f7d; --acc:#d9a441; --bad:#c9503f; --good:#6f9e5a;
    --paper:#efe6d4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;}
  body{display:flex; justify-content:center; padding:10px;}
  #app{width:100%; max-width:560px;}

  /* ── 상단 바 ── */
  #hud{display:flex; gap:10px; align-items:center; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:12px;}
  .hud-cell{flex:1; min-width:0;}
  .hud-lbl{font-size:10px; color:var(--tx2); letter-spacing:.08em;}
  .hud-val{font-size:16px; font-weight:700; margin-top:1px; white-space:nowrap;}
  #lives{color:var(--bad); letter-spacing:2px;}
  #clock{font-variant-numeric:tabular-nums;}
  #clock.low{color:var(--bad); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .icon-btn{background:none;border:1px solid var(--line);color:var(--tx2);border-radius:7px;
    padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit;}
  .icon-btn:hover{color:var(--tx); border-color:var(--tx2);}

  /* ── 사건 머리말 ── */
  #brief{border-left:3px solid var(--acc); padding:2px 0 2px 11px; margin-bottom:14px;}
  #caseNo{font-size:11px; color:var(--tx2); letter-spacing:.1em;}
  .step{margin-left:9px; padding:2px 8px; border-radius:5px; letter-spacing:.04em;
    background:var(--acc); color:#1a1611; font-weight:700;}
  #intro{font-size:14.5px; line-height:1.5; margin-top:3px;}
  #rule{font-size:13px; color:var(--acc); margin-top:6px; line-height:1.5;}

  /* ── 용의자 ── */
  #people{display:flex; flex-direction:column; gap:8px;}
  .p{display:flex; gap:11px; align-items:flex-start; background:var(--panel);
    border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:9px; padding:11px 12px; cursor:pointer; user-select:none;
    transition:border-color .12s, opacity .12s, background .12s;}
  .p:active{transform:scale(.995);}
  .face{flex:0 0 auto; width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700; color:#1a1611;}
  .pbody{flex:1; min-width:0;}
  .pname{font-size:14px; font-weight:700;}
  .pjob{font-size:11.5px; color:var(--tx2); margin-left:6px; font-weight:400;}
  .pmot{font-size:11.5px; color:var(--tx2); margin-top:3px;}
  .pmot::before{content:'수사 기록 — '; color:#6f6555;}
  html[lang="en"] .pmot::before{content:'case file — ';}
  .psay{font-size:14px; line-height:1.55; margin-top:6px; color:var(--paper);
    font-style:italic;}
  .psay b{font-style:normal; color:#fff; font-weight:700;}
  .silentline{color:#7a7060;}
  .pfinal{font-size:13.5px; line-height:1.5; margin-top:7px; padding-top:7px;
    border-top:1px dashed var(--line); color:var(--acc); font-style:italic;}
  .pfinal b{font-style:normal; font-weight:700;}
  .pmark{flex:0 0 auto; width:22px; text-align:center; font-size:17px; font-weight:800;}

  .p.out{opacity:.4;}
  .p.out .pmark{color:var(--bad);}
  .p:hover{border-color:var(--tx2);}
  .p.picked{border-color:var(--bad)!important; border-left-color:var(--bad)!important;
    background:#2c1a17; opacity:1;}
  .p.picked .pmark{color:var(--bad);}

  /* ── 이름 추적 ── */
  .ref{text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px;
    text-decoration-color:#6f6555; cursor:pointer;}
  .ref:hover{color:var(--acc); text-decoration-color:var(--acc);}
  .p.focus{border-left-color:var(--acc)!important; background:#241d14; opacity:1;}
  .p.focus .face{box-shadow:0 0 0 2px var(--acc);}
  .p.rel{border-left-color:#8a6a2a; opacity:1;}
  .p.rel .psay{color:#f3e4c2;}
  .p.dimmed{opacity:.3;}
  .focusbar{display:flex; align-items:center; gap:8px; margin:0 2px 9px;
    font-size:12.5px; color:var(--acc);}
  .focusbar button{background:none; border:1px solid var(--line); color:var(--tx2);
    border-radius:6px; padding:3px 8px; font-size:11px; cursor:pointer; font-family:inherit;}

  /* 결과 화면에서 진실/거짓 표시 */
  .verdict{font-size:11px; font-weight:700; padding:2px 7px; border-radius:5px; margin-left:7px;
    vertical-align:middle;}
  .verdict.t{background:#26361d; color:var(--good);}
  .verdict.f{background:#3a1e1a; color:var(--bad);}

  /* ── 하단 ── */
  #actions{margin-top:14px; display:flex; gap:8px;}
  .btn{flex:1; padding:13px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel2); color:var(--tx); font-size:14px; font-weight:700;
    font-family:inherit; cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--acc); color:#1a1611; border-color:var(--acc);}
  .btn.danger{background:#3a1e1a; color:var(--bad); border-color:#5c3129;}
  #hint{margin-top:9px; font-size:12px; color:var(--tx2); text-align:center; min-height:16px;}

  /* ── 오버레이 ── */
  .ov{position:fixed; inset:0; background:rgba(10,8,6,.92); display:flex;
    align-items:center; justify-content:center; padding:16px; z-index:20;}
  .ov.hidden{display:none;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:20px; width:100%; max-width:430px; max-height:88vh; overflow:auto;}
  .card h2{margin:0 0 6px; font-size:21px;}
  .card p{margin:7px 0; font-size:13.5px; line-height:1.6; color:var(--tx2);}
  .card p b{color:var(--tx);}
  .big{font-size:30px; font-weight:800; text-align:center; margin:10px 0;}
  ul.rules{margin:8px 0; padding-left:18px; font-size:13.5px; line-height:1.7; color:var(--tx2);}
  ul.rules li{margin-bottom:7px;}
  ul.rules b{color:var(--tx);}
  .reveal{margin-top:10px; display:flex; flex-direction:column; gap:5px;}
  .rrow{font-size:13px; line-height:1.45; padding:7px 9px; border-radius:7px; background:var(--panel2);}
  .rrow .rn{font-weight:700;}
  .rrow .rs{color:var(--tx2); font-style:italic;}
  .rrow.culprit{background:#3a1e1a;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-cell"><div class="hud-lbl" data-t="solved">해결</div><div class="hud-val" id="solved">—</div></div>
    <div class="hud-cell"><div class="hud-lbl" data-t="clockLbl">남은 시간</div><div class="hud-val" id="clock">—</div></div>
    <div class="hud-cell"><div class="hud-lbl" data-t="lives">기회</div><div class="hud-val" id="lives">●●●</div></div>
    <button class="icon-btn" id="langBtn">EN</button>
    <button class="icon-btn" id="helpBtn">?</button>
  </div>

  <div id="brief">
    <div id="caseNo"></div>
    <div id="intro"></div>
    <div id="rule"></div>
  </div>

  <div id="focusbar"></div>
  <div id="people"></div>

  <div id="actions"></div>
  <div id="hint"></div>
</div>

<div class="ov hidden" id="resultOv"><div class="card" id="resultCard"></div></div>
<div class="ov hidden" id="helpOv"><div class="card" id="helpCard"></div></div>
<div class="ov" id="titleOv"><div class="card" id="titleCard"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════
   밸런싱 노브 — 여기만 만지면 됨
   ═══════════════════════════════════════════════════════════ */
const CONFIG = {
  LIVES: 3,           // 오답 지목 가능 횟수
  TOTAL_CASES: 12,    // 한 판의 길이

  // 사건마다 주어지는 제한시간(초) = BASE + PER_PERSON × 용의자 수.
  // 5명 1분 45초 … 10명 3분. 한 판 전체로는 20~25분쯤.
  // ※ 초를 다투게 하려는 게 아니라 늘어지지 않게 하려는 것이다. 너무 빡빡하면
  //   추리를 포기하고 찍게 되는데, 그건 이 게임에서 제일 피하려던 상태다.
  //   플레이테스트에서 시간에 쫓겨 찍는다는 말이 나오면 PER_PERSON 부터 올릴 것.
  TIME_BASE: 30,
  TIME_PER_PERSON: 20,

  // 2단계는 시계를 새로 준다.
  // ※ 1단계에서 오래 고민했다고 범인 지목에서 시간이 말라버리면, 어려운 부분을 다 풀고
  //   쉬운 부분에서 죽는 셈이라 제일 억울하다. 실제로 플레이테스트에서 그렇게 끊겼다.
  TIME_PHASE2_BASE: 20,
  TIME_PHASE2_PER_LIAR: 20,
};

/* 사건마다 규칙이 바뀐다.
   ※ 계속하게 만드는 힘이 "몇 건 풀었나"가 아니라 "다음엔 무슨 문제가 나올까"라는
     플레이테스트 결과에 따라, 컨텐츠 축을 크기가 아니라 규칙으로 잡았다.
     사건 수를 늘리거나 인원을 불리는 건 공략법을 아는 사람에게 같은 판의 반복이다.

   twist 종류
     basic     거짓말하는 사람은 범인 하나뿐
     insider   결백한데 거짓말하는 사람이 섞인다
     silent    한 명은 끝내 입을 열지 않았다. 그 사람이 범인일 수도 있다
     inverted  범인은 거짓말을 하지 않았다 — 거짓말한 사람은 전부 결백하다
     hidden    거짓말쟁이가 몇 명인지 알려주지 않는다 (누군가 그 수를 주장한다)

   새 규칙을 더할 때 손볼 곳: STAGES 표, solutions(), generateCase(), 규칙 문구(T).

   ※ 진술은 전부 공개한다. 예전에 증언을 여는 데 자원을 쓰게 했다가, 정보를 감춰서
     어렵게 만드니 "다 듣지 않으면 무조건 찍어야 하는" 상황이 나왔고 두 테스터 모두
     그걸 "운"으로 느꼈다. 어려움은 추론 자체에서만 나와야 한다.
*/
// 새 규칙이 나오는 사건은 인원을 한 번 줄인다 — 규칙에 적응할 여지를 주려고.
const STAGES = [
  /* 1  */ {people:5, extraLiars:0, twist:'basic'},
  /* 2  */ {people:6, extraLiars:0, twist:'basic'},
  /* 3  */ {people:6, extraLiars:1, twist:'insider'},
  /* 4  */ {people:7, extraLiars:1, twist:'insider'},
  /* 5  */ {people:6, extraLiars:1, twist:'silent'},
  /* 6  */ {people:7, extraLiars:1, twist:'silent'},
  /* 7  */ {people:6, extraLiars:2, twist:'inverted'},
  /* 8  */ {people:7, extraLiars:2, twist:'inverted'},
  /* 9  */ {people:8, extraLiars:2, twist:'insider'},
  /* 10 */ {people:7, extraLiars:1, twist:'hidden'},
  /* 11 */ {people:8, extraLiars:2, twist:'hidden'},
  /* 12 */ {people:9, extraLiars:2, twist:'hidden'},
];
const MAX_HIDDEN_LIARS = 3;   // 익명 사건에서 거짓말쟁이 수의 상한 (플레이어에게도 알려준다)
const ADVANCED_FROM = 5;      // "범인은 A와 B 중 하나다" 같은 진술이 나오기 시작하는 사건
const stageCfg = n => STAGES[Math.min(n, STAGES.length) - 1];

/* ═══════════════════════════════════════════════════════════
   인물과 배경
   ═══════════════════════════════════════════════════════════ */
const CAST = [
  {ko:'윤서린', en:'Seorin',  jko:'전당포 주인',   jen:'pawnbroker'},
  {ko:'박정한', en:'Junghan', jko:'야간 경비',     jen:'night guard'},
  {ko:'최민경', en:'Minkyung',jko:'간호사',        jen:'nurse'},
  {ko:'하도진', en:'Dojin',   jko:'부두 인부',     jen:'dockhand'},
  {ko:'임세아', en:'Sea',     jko:'극단 배우',     jen:'stage actor'},
  {ko:'강태오', en:'Taeo',    jko:'택시 기사',     jen:'cab driver'},
  {ko:'노유진', en:'Yujin',   jko:'사진관 주인',   jen:'photographer'},
  {ko:'서기환', en:'Kihwan',  jko:'신문 기자',     jen:'newspaperman'},
  {ko:'문해원', en:'Haewon',  jko:'약사',          jen:'pharmacist'},
  {ko:'조석우', en:'Seokwoo', jko:'시계 수리공',   jen:'watchmaker'},
  {ko:'백지완', en:'Jiwan',   jko:'부동산 중개인', jen:'estate agent'},
  {ko:'구예린', en:'Yerin',   jko:'재봉사',        jen:'seamstress'},
  {ko:'신동혁', en:'Donghyuk',jko:'우체부',        jen:'postman'},
  {ko:'오채린', en:'Chaerin', jko:'서점 점원',     jen:'bookshop clerk'},
  {ko:'정무열', en:'Muyeol',  jko:'전기 기술자',   jen:'electrician'},
  {ko:'황선재', en:'Sunjae',  jko:'요리사',        jen:'cook'},
];
const FACE_COLORS = ['#c98b5a','#a8895f','#8f9a6b','#7c8fa3','#a67f8c','#9b8caa','#b0906a','#89a08f'];

// 진술자가 있던 자리. "왜 그걸 아는지"의 근거가 된다.
const SPOTS = [
  {ko:'뒷문 쪽',    en:'the back door'},
  {ko:'복도 끝',    en:'the end of the corridor'},
  {ko:'계단참',     en:'the stairwell'},
  {ko:'창가',       en:'the window'},
  {ko:'좁은 통로',  en:'the narrow passage'},
  {ko:'문 바로 앞', en:'just outside the door'},
  {ko:'구석 자리',  en:'the corner'},
  {ko:'바깥 골목',  en:'the alley outside'},
];

// 결백한데도 거짓말한 사람이 숨기고 있던 것. 최후의 발언에서 밝혀진다.
// 이게 없으면 "결백한데 왜 거짓말을 하지?"라는 구멍이 남는다.
const SECRETS = [
  {ko:'도박빚을 숨기려고 그랬다',            en:'I was hiding my gambling debts'},
  {ko:'그날 밤 만나던 사람을 숨기려고 그랬다', en:'I was hiding who I was seeing that night'},
  {ko:'가게 물건에 손을 댄 걸 숨기려고 그랬다', en:'I had been stealing from the shop'},
  {ko:'전과가 있다는 걸 숨기려고 그랬다',     en:'I have a record I did not want dug up'},
  {ko:'몰래 이사를 준비하던 걸 숨기려고 그랬다', en:'I was quietly packing to leave town'},
  {ko:'약을 훔쳐 쓰던 걸 숨기려고 그랬다',    en:'I had been taking medicine that was not mine'},
  {ko:'남의 편지를 뜯어본 걸 숨기려고 그랬다', en:'I had opened letters that were not mine'},
  {ko:'가짜 서류를 만든 걸 숨기려고 그랬다',  en:'I had forged some papers'},
];

// 피해자와의 관계. 전원이 하나씩 갖는다 — 누구 하나를 가리키는 단서가 아니라
// "여기 있는 전부에게 이유가 있었다"는 배경이다. 추리에는 관여하지 않는다.
const MOTIVES = [
  {ko:'피해자에게 돈을 빌려준 사이',   en:'had lent the victim money'},
  {ko:'피해자와 크게 다툰 적이 있다',  en:'had quarrelled with the victim'},
  {ko:'피해자의 옛 동업자',            en:"the victim's former partner"},
  {ko:'해고를 앞두고 있었다',          en:'was about to be dismissed'},
  {ko:'피해자에게 약점을 잡혀 있었다', en:'was being blackmailed'},
  {ko:'유산의 상속인',                 en:'stood to inherit'},
  {ko:'같은 자리를 노리던 경쟁자',     en:'was after the same position'},
  {ko:'피해자의 비밀을 알고 있었다',   en:"knew the victim's secret"},
  {ko:'빚 독촉에 시달리고 있었다',     en:'was hounded by creditors'},
  {ko:'오래 연락을 끊었던 가족',       en:'was estranged family'},
];

const PLACES = [
  {ko:'부두 창고',     en:'a dockside warehouse'},
  {ko:'극장 분장실',   en:'a theatre dressing room'},
  {ko:'기차 식당칸',   en:'a train dining car'},
  {ko:'저택 서재',     en:'a manor study'},
  {ko:'시계탑 계단',   en:'the clocktower stairs'},
  {ko:'병원 뒷문',     en:'a hospital back door'},
  {ko:'폐업한 사진관', en:'a shuttered photo studio'},
  {ko:'항구 등대',     en:'the harbour lighthouse'},
];

/* ─── 한국어 조사 ─── */
const hasBatchim = s => {
  const c = s.charCodeAt(s.length-1);
  return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0;
};
const eunNeun = n => n + (hasBatchim(n) ? '은' : '는');
const iGa     = n => n + (hasBatchim(n) ? '이' : '가');
const eulReul = n => n + (hasBatchim(n) ? '을' : '를');
const iEotDa  = n => n + (hasBatchim(n) ? '이었' : '였');   // 정무열이었다 / 임세아였다
// 이름이 링크로 감싸이면 문자열 끝이 태그라 받침을 못 본다. 조사만 따로 뽑아 쓴다.
const josaWa  = n => hasBatchim(n) ? '과' : '와';
const josaEun = n => hasBatchim(n) ? '은' : '는';
const josaI   = n => hasBatchim(n) ? '이' : '가';

/* ═══════════════════════════════════════════════════════════
   언어
   ═══════════════════════════════════════════════════════════ */
let LANG = 'ko';
const T = {
  solved:{ko:'해결', en:'SOLVED'}, lives:{ko:'기회', en:'LIVES'},
  clockLbl:{ko:'남은 시간', en:'TIME'},
  timeUp:{ko:'시간 초과', en:'OUT OF TIME'},
  timeUpNote:{ko:'용의자들을 더 붙잡아 둘 수 없었다.', en:'You could not hold them any longer.'},
  caseNo:{ko:(n,tot)=>`사건 ${n} / ${tot}`, en:(n,tot)=>`CASE ${n} / ${tot}`},

function t(k, ...a){ const v = T[k][LANG]; return typeof v === 'function' ? v(...a) : v; }

/* ═══════════════════════════════════════════════════════════
   진술
   ═══════════════════════════════════════════════════════════
   speaker  : 말한 사람의 인덱스
   type     : accuse | clear | denySelf | liar | truth
   target   : 대상 인덱스 (denySelf 는 없음)

   진술의 참·거짓은 (범인이 누구인가, 거짓말한 사람이 누구누구인가)에 달려 있다.
   liar/truth 는 다른 진술의 참·거짓을 가리키는 자기참조라 이 게임의 맛을 만든다.
*/
function stmtIsTrue(st, culprit, liarSet){
  switch(st.type){
    case 'accuse':   return st.target === culprit;
    case 'clear':    return st.target !== culprit;
    case 'denySelf': return st.speaker !== culprit;
    case 'liar':     return liarSet.has(st.target);
    case 'truth':    return !liarSet.has(st.target);
    case 'count':    return liarSet.size === st.k;   // 익명 사건에서만 나온다
    // ── 아래 둘은 "둘 중 적어도 하나" 형태. 한 명을 특정하지 않고 범위만 좁힌다.
    case 'either':     return st.a === culprit || st.b === culprit;
    case 'eitherLiar': return liarSet.has(st.a) || liarSet.has(st.b);
  }
}
/* 진술문 만들기.
   앞부분은 "그걸 어떻게 아는가"를 대는 근거이고, <b>로 감싼 뒷부분이 실제 주장이다.
   참·거짓은 굵은 주장에 대해서만 따진다 (규칙 설명에도 그렇게 적어뒀다).
   근거를 붙인 이유: "박정한은 거짓말을 하고 있다"를 화자가 어떻게 아는지 설명할 수
   없으면 추리물이 아니라 이름표 붙은 논리 기호가 된다는 지적을 받았다. */
// linkify: 진술 속 이름을 누를 수 있게 감싼다. 누르면 그 사람이 얽힌 진술이 전부 표시된다.
// 화면에 이미 적혀 있는 걸 찾아 훑는 건 추리가 아니라 노동이라 도와줘도 되는 부분이다.
function stmtText(st, people, linkify){
  const wrap = (i,nm) => linkify ? `<span class="ref" data-i="${i}">${nm}</span>` : nm;
  const raw = st.target != null ? people[st.target].name[LANG] : null;
  const X = raw != null ? wrap(st.target, raw) : null;
  const RA = st.a != null ? people[st.a].name[LANG] : '';
  const RB = st.b != null ? people[st.b].name[LANG] : '';
  const A = st.a != null ? wrap(st.a, RA) : '';
  const B = st.b != null ? wrap(st.b, RB) : '';
  const S = SPOTS[st.spot][LANG];
  const v = st.v;

  if(LANG === 'ko'){
    switch(st.type){
      case 'accuse': return v
        ? `${X}${josaEun(raw)} 그날 밤 손을 떨고 있었다. 내가 똑똑히 봤다. <b>${X}${josaI(raw)} 범인이다.</b>`
        : `나는 ${S}에 있었다. ${X}${josaI(raw)} 거기서 빠져나오는 걸 봤다. <b>${X}${josaI(raw)} 범인이다.</b>`;
      case 'clear': return v
        ? `내가 ${S}에서 ${X}${hasBatchim(raw)?'을':'를'} 계속 보고 있었다. <b>${X}${josaEun(raw)} 범인이 아니다.</b>`
        : `${X}${josaEun(raw)} 그 시간 내내 ${S}에서 나와 함께 있었다. <b>${X}${josaEun(raw)} 범인이 아니다.</b>`;
      case 'denySelf': return v
        ? `나는 ${S}에서 한 발짝도 움직이지 않았다. <b>나는 범인이 아니다.</b>`
        : `나는 그때 ${S}에 있었고 아무 데도 가지 않았다. <b>나는 범인이 아니다.</b>`;
      case 'liar': return v
        ? `나는 ${S}에 있었으니까 안다. <b>${X}${josaEun(raw)} 거짓말을 하고 있다.</b>`
        : `${X}${josaI(raw)} 한 말은 내가 ${S}에서 본 것과 다르다. <b>${X}${josaEun(raw)} 거짓말을 하고 있다.</b>`;
      case 'truth': return v
        ? `${X}${josaI(raw)} 한 말은 내가 아는 것과 정확히 맞는다. <b>${X}${josaEun(raw)} 진실을 말하고 있다.</b>`
        : `나도 ${S}에서 같은 것을 봤다. <b>${X}${josaEun(raw)} 진실을 말하고 있다.</b>`;
      case 'count': return v
        ? `나는 ${S}에서 다들 뭐라고 하는지 다 들었다. <b>여기서 거짓말을 하고 있는 사람은 ${st.k}명이다.</b>`
        : `${S}에 있었으니 누가 무슨 말을 했는지 안다. <b>지금 거짓말을 하고 있는 사람은 ${st.k}명이다.</b>`;
      case 'either': return v
        ? `${S}에서 그림자 둘이 엉키는 걸 봤다. 누가 누군지까지는 못 봤다. <b>범인은 ${A}${josaWa(RA)} ${B} 중 하나다.</b>`
        : `나는 ${S}에 있었고 나머지는 다 눈에 들어왔다. <b>범인은 ${A}${josaWa(RA)} ${B} 중 하나다.</b>`;
      case 'eitherLiar': return v
        ? `저 둘이 하는 말이 서로 어긋난다. <b>${A}${josaWa(RA)} ${B} 중 적어도 한 명은 거짓말을 하고 있다.</b>`
        : `${S}에서 본 것과 저 둘의 말을 맞춰보면 안 맞는다. <b>${A}${josaWa(RA)} ${B} 중 적어도 한 명은 거짓말을 하고 있다.</b>`;
    }
  }
  switch(st.type){
    case 'accuse': return v
      ? `${X}'s hands were shaking that night. I saw it clearly. <b>${X} did it.</b>`
      : `I was at ${S}. I saw ${X} slip away from there. <b>${X} did it.</b>`;
    case 'clear': return v
      ? `I had ${X} in sight from ${S} all evening. <b>${X} didn't do it.</b>`
      : `${X} was with me at ${S} the whole time. <b>${X} didn't do it.</b>`;
    case 'denySelf': return v
      ? `I never moved from ${S}. <b>I didn't do it.</b>`
      : `I was at ${S} the whole time and went nowhere. <b>I didn't do it.</b>`;
    case 'liar': return v
      ? `I was at ${S}, so I know. <b>${X} is lying.</b>`
      : `What ${X} says does not match what I saw from ${S}. <b>${X} is lying.</b>`;
    case 'truth': return v
      ? `What ${X} says matches exactly what I know. <b>${X} is telling the truth.</b>`
      : `I saw the same thing from ${S}. <b>${X} is telling the truth.</b>`;
    case 'count': return v
      ? `I heard every word from ${S}. <b>Exactly ${st.k} of us are lying.</b>`
      : `I was at ${S}, so I know who said what. <b>${st.k} of us are lying right now.</b>`;
    case 'either': return v
      ? `I saw two shadows tangle at ${S}, but not who they were. <b>The culprit is either ${A} or ${B}.</b>`
      : `I was at ${S} and had everyone else in view. <b>The culprit is either ${A} or ${B}.</b>`;
    case 'eitherLiar': return v
      ? `Those two contradict each other. <b>At least one of ${A} and ${B} is lying.</b>`
      : `What I saw from ${S} does not fit what those two say. <b>At least one of ${A} and ${B} is lying.</b>`;
  }
}

// 최후의 발언. 앞의 한 줄은 둘 다 똑같이 말하고(그래야 말투로 안 들킨다),
// 뒤의 굵은 주장만 참·거짓이 갈린다.
// 최후의 발언이 참인가 — 1단계에서 밝혀진 거짓말쟁이 집합에 비추어 판정한다.
function finalIsTrue(f, liarSet){
  const la = liarSet.has(f.a), lb = liarSet.has(f.b);
  if(f.mode === 'both') return !la && !lb;
  if(f.mode === 'none') return la && lb;
  return la !== lb;
}
function finalText(f, people, linkify){
  const nm = i => linkify
    ? `<span class="ref" data-i="${i}">${people[i].name[LANG]}</span>`
    : people[i].name[LANG];
  const ra = people[f.a].name[LANG], rb = people[f.b].name[LANG];
  return `${t('finalLead')} <b>${t('final_'+f.mode, nm(f.a), nm(f.b), josaWa(ra), josaEun(rb))}</b>`;
}

/* ═══════════════════════════════════════════════════════════
   사건 생성
   ═══════════════════════════════════════════════════════════ */
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[rnd(a.length)];

// 가능한 모든 (범인, 거짓말쟁이 집합) 조합을 훑어 앞뒤가 맞는 것을 센다.
// 범인은 반드시 거짓말하므로 거짓말쟁이 집합에는 항상 범인이 들어간다.
/* 앞뒤가 맞는 (범인, 거짓말쟁이 집합) 조합을 전부 찾는다.

   거짓말쟁이 집합에는 말을 한 사람만 들어간다 (침묵자는 거짓말도 못 한다).
   inverted 규칙에서는 범인이 거짓말을 하지 않았으므로 범인이 집합에서 빠진다.
   hidden 규칙에서는 집합 크기를 모르므로 1명부터 상한까지 전부 훑는다. */
function solutions(stmts, q){
  const {n, K, hidden, inverted, silent} = q;
  const out = [];
  const speakers = [];
  for(let i=0;i<n;i++) if(i !== silent) speakers.push(i);

  for(let c=0;c<n;c++){
    // 범인 본인이 거짓말쟁이 집합에 들어가는가
    const selfLies = !inverted && c !== silent;
    const pool = speakers.filter(i=>i !== c);
    const sizes = hidden
      ? Array.from({length: MAX_HIDDEN_LIARS}, (_,i)=>i)   // 범인 외에 0 ~ 상한-1 명
      : [K];
    for(const want of sizes){
      if(want > pool.length) continue;
      const combo = (start, acc)=>{
        if(acc.length === want){
          const L = new Set(selfLies ? [c, ...acc] : acc);
          for(const st of stmts) if(stmtIsTrue(st, c, L) !== !L.has(st.speaker)) return;
          out.push({culprit:c, liars:[...L].sort((a,b)=>a-b)});
          return;
        }
        for(let i=start;i<pool.length;i++) combo(i+1, [...acc, pool[i]]);
      };
      combo(0, []);
    }
  }
  return out;
}

// 어떤 사람 p 의 진술을, 원하는 참·거짓에 맞게 하나 만든다.
// used 에는 이미 나온 주장의 키가 들어 있다. 두 사람이 똑같은 문장을 말하면
// 사람 수만큼 정보가 늘지 않아 사건이 헐거워진다 (플레이테스트에서 지적됨).
// "나는 범인이 아니다"는 화자마다 다른 주장이므로 중복으로 치지 않는다.
const stmtKey = st =>
  st.type === 'denySelf' ? `denySelf:${st.speaker}`
  : st.type === 'count'  ? `count:${st.k}`
  : st.a != null         ? `${st.type}:${st.a}-${st.b}`
  : `${st.type}:${st.target}`;
function makeStmt(p, n, culprit, liarSet, wantTrue, hidden, used, advanced){
  const others = [];
  for(let i=0;i<n;i++) if(i!==p) others.push(i);
  const cand = [];
  const push = (type, target) => cand.push({speaker:p, type, target});

  for(const x of others){
    if(wantTrue){
      if(x === culprit) push('accuse', x);
      else             push('clear',  x);
      if(liarSet.has(x)) push('liar',  x);
      else               push('truth', x);
    }else{
      if(x !== culprit) push('accuse', x);
      else              push('clear',  x);      // 범인을 결백하다고 말하는 거짓
      if(!liarSet.has(x)) push('liar',  x);
      else                push('truth', x);
    }
  }
  // "나는 범인이 아니다" — 결백하면 참, 범인이면 거짓
  if(wantTrue ? p !== culprit : p === culprit) push('denySelf', null);

  // 익명 사건에서만: 거짓말쟁이 수를 주장한다
  if(hidden){
    if(wantTrue) cand.push({speaker:p, type:'count', k:liarSet.size});
    else for(let k=1; k<=MAX_HIDDEN_LIARS; k++)
      if(k !== liarSet.size) cand.push({speaker:p, type:'count', k});
  }

  // 후반 사건에서만: "둘 중 하나" 형태. 한 명을 특정하지 않고 범위만 좁힌다.
  if(advanced){
    for(let a=0; a<n; a++) for(let b=a+1; b<n; b++){
      if(a === p || b === p) continue;
      const hasCulprit = (a === culprit || b === culprit);
      const hasLiar    = liarSet.has(a) || liarSet.has(b);
      if(wantTrue === hasCulprit) cand.push({speaker:p, type:'either',     a, b});
      if(wantTrue === hasLiar)    cand.push({speaker:p, type:'eitherLiar', a, b});
    }
  }

  const fresh = used ? cand.filter(st=>!used.has(stmtKey(st))) : cand;
  return fresh.length ? pick(fresh) : null;
}

function generateCase(caseNo){
  const cfg = stageCfg(caseNo);
  const n = cfg.people, twist = cfg.twist || 'basic';
  const hidden = twist === 'hidden', inverted = twist === 'inverted';
  const advanced = caseNo >= ADVANCED_FROM;   // "둘 중 하나" 형태가 등장하는 시점
  // 익명 사건은 수를 안 알려주므로, 실제 수도 매번 달라야 한다. 늘 같으면 곧 들킨다.
  const K = hidden ? rnd(cfg.extraLiars + 1) : cfg.extraLiars;

  for(let attempt=0; attempt<600; attempt++){
    const culprit = rnd(n);
    // 침묵 사건: 한 명은 아무 말도 하지 않는다. 범인일 수도 있다.
    const silent = twist === 'silent' ? rnd(n) : null;
    const speakers = []; for(let i=0;i<n;i++) if(i !== silent) speakers.push(i);
    const q = {n, K, hidden, inverted, silent};

    // 거짓말쟁이 집합. inverted 면 범인은 여기 들어가지 않는다.
    const pool = speakers.filter(i=>i !== culprit);
    if(pool.length < K) continue;
    const extra = shuffle(pool.slice()).slice(0, K);
    const selfLies = !inverted && culprit !== silent;
    const liarSet = new Set(selfLies ? [culprit, ...extra] : extra);

    const stmts = [];
    const used = new Set();
    let ok = true;
    for(const p of speakers){
      const st = makeStmt(p, n, culprit, liarSet, !liarSet.has(p), hidden, used, advanced);
      if(!st){ ok = false; break; }
      used.add(stmtKey(st));
      stmts.push(st);
    }
    if(!ok) continue;

    // 익명 사건은 거짓말쟁이 수를 알려주지 않으므로, 그 수를 말하는 진술이 하나는 있어야
    // 플레이어에게 잡을 손잡이가 생긴다.
    if(hidden && !stmts.some(st=>st.type === 'count')) continue;

    // 앞뒤가 맞는 답이 정확히 하나여야 한다
    const sols = solutions(stmts, q);
    if(sols.length !== 1) continue;

    // 진술 하나만 보고 답이 나오면 퍼즐이 아니다
    let trivial = false;
    for(const st of stmts){
      if(solutions([st], q).length === 1){ trivial = true; break; }
    }
    if(trivial) continue;

    // 진술 몇 개가 실제로 답을 좁히는 데 꼭 필요한지 센다 (빼면 답이 여러 개가 되는 진술).
    // 처음엔 "모든 진술이 필요할 것"을 요구했는데, 측정해보니 그게 후보의 92~95%를 걷어내
    // 거짓말쟁이가 범인 하나뿐인 사건(K=0)은 아예 만들어지지 않았다. 그래서 하한만 둔다.
    const minNeeded = K === 0 ? 2 : 3;
    let needed = 0;
    for(let i=0;i<stmts.length;i++){
      if(solutions(stmts.filter((_,j)=>j!==i), q).length !== 1) needed++;
    }
    if(needed < minNeeded) continue;

    // ── 범인을 가르는 근거의 두께 ──
    // 거짓말쟁이 집합 안에서 범인을 다른 사람으로 바꿨을 때 어긋나는 진술이 몇 개인가.
    // 예전에 재보니 75~82%의 사건이 단 하나뿐이었다. 문장 하나를 놓치면 근거가 사라지니
    // 플레이어에겐 찍는 것과 같다. 그때는 2단계(최후의 발언)로 때웠는데, 그러려면
    // 참·거짓을 미리 공개해야 하고 그러면 "이미 진실로 밝혀진 사람을 거짓말쟁이라고
    // 우기는" 이상한 발언이 나온다. 땜빵 대신 증거 자체를 두껍게 만든다.
    if(liarSet.size > 1){
      let thin = false;
      for(const alt of liarSet){
        if(alt === culprit) continue;
        let breaks = 0;
        for(const st of stmts) if(stmtIsTrue(st, alt, liarSet) !== !liarSet.has(st.speaker)) breaks++;
        if(breaks < 2){ thin = true; break; }
      }
      if(thin) continue;
    }

    // ── 지름길 차단 ──
    // "남을 무죄라고 말한 사람과 그 대상은 둘 다 무죄" 라는 지름길이 있다.
    // 거짓말쟁이가 범인 하나뿐이면 이건 실제로 성립한다 — 범인은 그런 말을 아예 할 수
    // 없기 때문이다("X는 범인이 아니다"가 거짓이려면 X가 범인이어야 하는데 그건 자기 자신이다).
    // 그대로 두면 초반 사건의 34~37%가 추론 없이 즉시 풀렸다. 플레이테스트에서 발견된 구멍.
    // 거짓말쟁이가 둘 이상인 사건에서는 이 지름길이 57~76%만 맞아서, 초반 사건이 뒤에서
    // 통하지 않는 방법을 가르치는 셈이기도 했다. 그래서 전 사건에 똑같이 막는다.
    const cheap = new Set();
    for(const st of stmts){
      if(st.type === 'clear' || st.type === 'truth'){ cheap.add(st.speaker); cheap.add(st.target); }
    }
    // (inverted 규칙은 범인이 거짓말을 하지 않으므로 이 지름길 자체가 성립하지 않는다)
    if(!inverted){
      let leftover = 0;
      for(let x=0; x<n; x++) if(!cheap.has(x)) leftover++;
      if(leftover === 1) continue;
    }

    const cast    = shuffle(CAST.slice()).slice(0, n);
    const motives = shuffle(MOTIVES.slice());
    const secrets = shuffle(SECRETS.slice());
    const spots   = shuffle(SPOTS.map((_,i)=>i));
    const people = cast.map((c,i)=>({
      idx:i, name:{ko:c.ko, en:c.en}, job:{ko:c.jko, en:c.jen},
      motive: motives[i % motives.length],
      secret: secrets[i % secrets.length],   // 결백한 거짓말쟁이일 때만 쓰인다
      face:FACE_COLORS[i % FACE_COLORS.length],
    }));
    // 진술자마다 있던 자리를 하나씩 준다. 그 자리가 "그걸 어떻게 아는지"의 근거가 된다.
    stmts.forEach(st=>{ st.spot = spots[st.speaker % spots.length]; st.v = rnd(2); });

    // ── 최후의 발언 ──
    // 잡히고 나면 결백한 거짓말쟁이는 사실대로 말하고, 범인만 계속 거짓말한다.
    // 발언 내용은 "아까 누가 사실을 말했나"에 대한 것이라, 1단계에서 알아낸 걸로
    // 그대로 검증된다. 그래서 2단계도 찍기가 아니라 추리가 된다.
    // ※ 처음엔 한 사람의 참·거짓만 가리키게 했더니 배지 한 번 조회로 끝나 너무 쉬웠다.
    //   두 사람을 묶은 주장으로 바꿔서 조회 두 번과 비교가 필요하게 만든다.
    //   mode: both = 둘 다 사실, none = 둘 다 거짓, one = 한 명만 사실
    const modeOf = (a,b) => {
      const la = liarSet.has(a), lb = liarSet.has(b);
      return (!la && !lb) ? 'both' : (la && lb) ? 'none' : 'one';
    };
    // 범인 후보 — 거짓말쟁이에 침묵자를 더한다. 침묵한 사람도 범인일 수 있기 때문.
    const accused = inverted ? [] : [...new Set([...liarSet, ...(silent != null ? [silent] : [])])]
                                      .sort((a,b)=>a-b);

    return {people, stmts, culprit, liars:liarSet, accused,
            extraLiars:K, twist, hidden, inverted, silent,
            caseNo, place:pick(PLACES)};
  }
  return null;
}

/* ═══════════════════════════════════════════════════════════
   게임 상태
   ═══════════════════════════════════════════════════════════ */
let G = null;
function newGame(){
  G = {caseNo:1, solved:0, lives:CONFIG.LIVES, cur:null, marks:{}, spent:0};
  loadCase();
}
// 이번 사건에서 골라야 하는 거짓말쟁이 수 (범인 포함)
const liarCount = () => G.cur.liars.size;
const chosen = () => Object.keys(G.marks).filter(k=>G.marks[k]==='liar').map(Number);
function loadCase(){
  let c = generateCase(G.caseNo);
  if(!c) c = generateCase(1);          // 이론상 도달 불가. 그래도 판이 멈추지 않게.
  G.cur = c; G.marks = {}; G.phase = c.inverted ? 2 : 1;
  G.culpritPick = null; G.focus = null; G.step1 = [];
  G.timeLeft = G.allot = CONFIG.TIME_BASE + CONFIG.TIME_PER_PERSON * c.people.length;
  render();
  startTimer();
}

/* ─── 제한시간 ───
   결과 화면이 떠 있는 동안과 규칙을 읽는 동안은 멈춘다. */
let TICK = null;
function startTimer(){
  stopTimer();
  G.paused = false;
  TICK = setInterval(()=>{
    if(G.paused) return;
    G.timeLeft--;
    drawClock();
    if(G.timeLeft === 10) beep(520,.08,'square',.045);
    if(G.timeLeft <= 0){ stopTimer(); onTimeout(); }
  }, 1000);
}
function stopTimer(){ if(TICK){ clearInterval(TICK); TICK = null; } }
function drawClock(){
  const s = Math.max(0, G.timeLeft);
  $('clock').textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  $('clock').className = 'hud-val' + (s <= 20 ? ' low' : '');
}
function onTimeout(){
  G.lives--;
  beep(180,.3,'sawtooth'); setTimeout(()=>beep(120,.4,'sawtooth'), 200);
  showResult(false, 'timeout');
}

/* ─── 소리 ─── */
let AC = null;
function beep(freq, dur=.09, type='sine', vol=.05){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   화면
   ═══════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
function mkBtn(label, cls, fn){
  const b = document.createElement('button');
  b.className = cls; b.textContent = label; b.onclick = fn; return b;
}

// 침묵한 사람은 진술이 없다. 그 자리를 비워두지 않고 침묵 자체를 보여준다.
function sayOf(c, idx){
  if(idx === c.silent) return `<span class="silentline">${t('saidNothing')}</span>`;
  const st = c.stmts.find(x=>x.speaker === idx);
  return `“${stmtText(st, c.people, true)}”`;
}

function render(){
  const c = G.cur;
  $('solved').textContent = `${G.solved}/${CONFIG.TOTAL_CASES}`;
  $('lives').textContent  = '●'.repeat(G.lives) + '○'.repeat(CONFIG.LIVES - G.lives);
  const chip = (G.phase === 2 && !c.inverted) ? t('stepTwo') : t('chap_' + c.twist);
  $('caseNo').innerHTML = t('caseNo', c.caseNo, CONFIG.TOTAL_CASES) +
    (chip ? `<span class="step">${chip}</span>` : '');
  drawClock();
  $('intro').textContent  = t('intro', c.place[LANG], c.people.length);
  $('rule').innerHTML =
      (G.phase === 2 && !c.inverted) ? t('phase2Rule')
    : c.twist === 'hidden' ? t('ruleHidden')
    : c.twist === 'silent' ? t('ruleSilent', c.liars.size)
    : c.inverted           ? t('ruleInverted', c.liars.size)
    : liarCount() > 1      ? t('ruleMany', liarCount()) : t('ruleOne');

  // 이름 추적: 지금 보고 있는 사람과, 그 사람을 언급한 진술의 화자들
  const rel = new Set();
  if(G.focus != null){
    rel.add(G.focus);
    c.stmts.forEach(st=>{ if(st.target === G.focus) rel.add(st.speaker); });
  }

  const box = $('people');
  box.innerHTML = '';
  c.people.forEach(p=>{
    const m = G.marks[p.idx];
    const isLiar = c.liars.has(p.idx);
    const el = document.createElement('div');
    const focusCls = G.focus == null ? ''
                   : p.idx === G.focus ? ' focus'
                   : rel.has(p.idx)    ? ' rel' : ' dimmed';

    if(G.phase === 2 && !c.inverted){
      // ※ 예전에는 여기서 참·거짓을 공개하고 최후의 발언을 시켰는데,
      //   이미 진실로 밝혀진 사람을 거짓말쟁이라고 우기는 발언이 나와 말이 안 됐다.
      //   공개도 발언도 없앴다. 1단계에서 고른 사람들 중 누가 범인인지만 마저 답한다.
      const isCand = G.step1.includes(p.idx) || p.idx === c.silent;
      const picked = G.culpritPick === p.idx;
      el.className = 'p' + (picked ? ' picked' : isCand ? '' : ' out') + focusCls;
      el.innerHTML = `
        <div class="face" style="background:${p.face}">${p.name[LANG][0]}</div>
        <div class="pbody">
          <div class="pname">${p.name[LANG]}<span class="pjob">${p.job[LANG]}</span></div>
          <div class="psay">${sayOf(c, p.idx)}</div>
        </div>
        <div class="pmark">${picked ? '✓' : ''}</div>`;
      if(isCand) el.onclick = ()=>{ G.culpritPick = p.idx; beep(340,.06,'square'); render(); };
    }else if(c.inverted){
      // 역전 사건: 참·거짓을 밝히지 않고 전원이 후보다. 곧바로 범인을 지목한다.
      const picked = G.culpritPick === p.idx;
      el.className = 'p' + (picked ? ' picked' : '') + focusCls;
      el.innerHTML = `
        <div class="face" style="background:${p.face}">${p.name[LANG][0]}</div>
        <div class="pbody">
          <div class="pname">${p.name[LANG]}<span class="pjob">${p.job[LANG]}</span></div>
          <div class="pmot">${p.motive[LANG]}</div>
          <div class="psay">${sayOf(c, p.idx)}</div>
        </div>
        <div class="pmark">${picked ? '✓' : ''}</div>`;
      el.onclick = ()=>{ G.culpritPick = p.idx; beep(340,.06,'square'); render(); };
    }else{
      const picked = m === 'liar';
      el.className = 'p' + (picked ? ' picked' : m==='out' ? ' out' : '') + focusCls;
      el.innerHTML = `
        <div class="face" style="background:${p.face}">${p.name[LANG][0]}</div>
        <div class="pbody">
          <div class="pname">${p.name[LANG]}<span class="pjob">${p.job[LANG]}</span></div>
          <div class="pmot">${p.motive[LANG]}</div>
          <div class="psay">${sayOf(c, p.idx)}</div>
        </div>
        <div class="pmark">${picked ? '✓' : m==='out' ? '✕' : ''}</div>`;
      if(p.idx !== c.silent) el.onclick = ()=>onPerson(p);   // 말을 안 했으니 거짓말쟁이로 찍을 수 없다
    }
    // 얼굴을 누르면 그 사람을 추적한다 (카드 전체 클릭과 겹치지 않게 전파를 막는다)
    el.querySelector('.face').onclick = ev=>{ ev.stopPropagation(); setFocus(p.idx); };
    box.appendChild(el);
  });
  // 진술 속 이름도 같은 역할
  box.querySelectorAll('.ref').forEach(a=>{
    a.onclick = ev=>{ ev.stopPropagation(); setFocus(+a.dataset.i); };
  });

  const fb = $('focusbar'); fb.innerHTML = '';
  if(G.focus != null){
    fb.className = 'focusbar';
    const n = rel.size - 1;
    fb.append(document.createTextNode(t('tracking', c.people[G.focus].name[LANG], n)));
    fb.appendChild(mkBtn(t('clearTrack'), '', ()=>setFocus(G.focus)));
  }else fb.className = '';

  const a = $('actions'); a.innerHTML = '';
  if(G.phase === 2){
    if(G.culpritPick != null){
      a.append(mkBtn(t('nameCulprit', c.people[G.culpritPick].name[LANG]), 'btn danger', ()=>doNameCulprit()));
    }else{
      const b = mkBtn(c.inverted ? t('namePickOnly') : t('pickCulprit'), 'btn');
      b.style.opacity = .45; b.style.cursor = 'default';
      a.append(b);
    }
    $('hint').textContent = c.inverted ? t('markHint') : t('phase2Hint');
  }else{
    // 지목 모드를 따로 두지 않는다. 사람을 눌러 거짓말쟁이로 찍고, 인원이 맞으면 확정된다.
    // 익명 사건은 몇 명인지 모르므로 한 명 이상이면 언제든 확정할 수 있다.
    const k = liarCount(), cur = chosen().length;
    const ready = c.hidden ? cur >= 1 : cur === k;
    if(ready){
      a.append(mkBtn(c.hidden ? t('submitAny', cur) : t('submitReady', k), 'btn danger', ()=>doSubmit()));
    }else{
      const b = mkBtn(c.hidden ? t('submitNone') : t('submitCount', cur, k), 'btn');
      b.style.opacity = .45; b.style.cursor = 'default';
      a.append(b);
    }
    $('hint').textContent = t('markHint');
  }
  $('langBtn').textContent = LANG === 'ko' ? 'EN' : '한';
  document.querySelectorAll('[data-t]').forEach(e=> e.textContent = t(e.dataset.t));
  document.documentElement.lang = LANG;
}

// 같은 사람을 다시 누르면 추적 해제
function setFocus(i){
  G.focus = (G.focus === i) ? null : i;
  beep(G.focus == null ? 280 : 460, .05, 'sine', .035);
  render();
}

// 없음 → 거짓말 ✓ → 진실 ✕ → 없음
function onPerson(p){
  const cur = G.marks[p.idx];
  if(cur === undefined){
    // 익명 사건에서 상한을 정답 인원으로 두면 그게 곧 답을 알려주는 셈이라 상한만 쓴다
    const cap = G.cur.hidden ? MAX_HIDDEN_LIARS : liarCount();
    if(chosen().length >= cap){ beep(160,.1,'square'); return; }
    G.marks[p.idx] = 'liar';  beep(340,.06,'square');
  }else if(cur === 'liar'){
    G.marks[p.idx] = 'out';   beep(260,.05,'square');
  }else{
    delete G.marks[p.idx];    beep(300,.04,'sine',.03);
  }
  render();
}

// 1단계 답을 들고 2단계로. 맞았는지는 알려주지 않는다 — 알려주면 남은 판단이 사라진다.
function doSubmit(){
  const c = G.cur;
  G.step1 = chosen().sort((a,b)=>a-b);
  beep(520,.09);
  // 고른 사람이 하나뿐이고 침묵자도 없으면 그 사람이 곧 범인이다
  const cands = G.step1.concat(c.silent != null ? [c.silent] : []);
  if(cands.length === 1){ G.culpritPick = cands[0]; return doNameCulprit(); }
  G.phase = 2; G.culpritPick = null;
  G.spent += G.allot - G.timeLeft;                       // 1단계에서 쓴 시간을 먼저 적립
  G.timeLeft = G.allot = CONFIG.TIME_PHASE2_BASE + CONFIG.TIME_PHASE2_PER_LIAR * cands.length;
  render();
  startTimer();
}

// 두 답을 한꺼번에 채점한다: 거짓말쟁이 명단과 범인이 모두 맞아야 해결.
function doNameCulprit(){
  const c = G.cur;
  const real = [...c.liars].sort((a,b)=>a-b);
  const liarsOk = c.inverted ||
    (G.step1.length === real.length && G.step1.every((v,i)=>v === real[i]));
  const culpritOk = G.culpritPick === c.culprit;
  const right = liarsOk && culpritOk;
  if(right){ G.solved++; beep(620,.1); setTimeout(()=>beep(830,.14), 90); }
  else     { G.lives--;  beep(200,.18,'sawtooth'); setTimeout(()=>beep(140,.24,'sawtooth'), 120); }
  showResult(right, right ? null : (liarsOk ? 'culprit' : 'liars'));
}

/* ─── 결과 ─── */
// reason: 'liars'(거짓말쟁이를 잘못 짚음) | 'culprit'(범인을 잘못 짚음) | 'timeout'
function showResult(right, reason){
  stopTimer();
  G.spent += Math.max(0, G.allot - G.timeLeft);          // 이번 단계에서 쓴 시간
  const c = G.cur;
  const dead = G.lives <= 0;
  // 침묵자는 진술이 없으므로 사람 번호로 진술을 찾으면 안 된다 (sayOf 가 처리한다).
  const rows = c.people.map(p=>{
    const lying = c.liars.has(p.idx);
    const badge = p.idx === c.silent ? ''
      : `<span class="verdict ${lying?'f':'t'}">${lying ? t('lie') : t('truth')}</span>`;
    return `<div class="rrow${p.idx===c.culprit?' culprit':''}">
      <span class="rn">${p.name[LANG]}</span>${badge}
      <div class="rs">${sayOf(c, p.idx)}</div>
    </div>`;
  }).join('');

  // 최후의 발언 — 이제 퍼즐이 아니라 연출이다. 결백한 거짓말쟁이는 숨기던 걸 털어놓고
  // 범인은 인정한다. "왜 결백한데 거짓말을 했나"가 여기서 풀린다.
  const last = (c.accused || []).map(i=>{
    const p = c.people[i];
    if(i === c.silent && i !== c.culprit) return '';
    const line = i === c.culprit ? t('culpritLine') : t('confess', p.secret[LANG]);
    return `<div class="rrow${i===c.culprit?' culprit':''}">
      <span class="rn">${p.name[LANG]}</span>
      <div class="rs">${line}</div></div>`;
  }).join('');

  $('resultCard').innerHTML = `
    <h2 style="color:${right?'var(--good)':'var(--bad)'}">${
      right ? t('right') : reason === 'timeout' ? t('timeUp') : t('wrong')}</h2>
    <p>${right ? '' : ({timeout:t('timeUpNote'), liars:t('missed'), culprit:t('liarsFound')}[reason] || '') + ' '
      }<b>${t('wasCulprit', c.people[c.culprit].name[LANG])}</b></p>
    ${last ? `<h3 style="margin:14px 0 4px;font-size:12px;color:var(--tx2);letter-spacing:.08em">${t('lastWords')}</h3>
    <div class="reveal">${last}</div>` : ''}
    <h3 style="margin:16px 0 4px;font-size:12px;color:var(--tx2);letter-spacing:.08em">${t('allSaid')}</h3>
    <div class="reveal">${rows}</div>
    <div style="margin-top:16px"></div>`;

  const end = dead || G.caseNo >= CONFIG.TOTAL_CASES;
  $('resultCard').appendChild(mkBtn(end ? t('finish') : t('next'), 'btn primary', ()=>{
    $('resultOv').classList.add('hidden');
    if(end) showEnd(dead);
    else { G.caseNo++; loadCase(); }
  }));
  $('resultOv').classList.remove('hidden');
}

const mmss = s => `${Math.floor(s/60)}분 ${String(s%60).padStart(2,'0')}초`;
function showEnd(busted){
  // 기록은 해결 건수가 우선, 같으면 걸린 시간이 짧은 쪽이 낫다
  let best;
  try{ best = JSON.parse(localStorage.getItem('testimony_record')) || null; }catch(e){ best = null; }
  const mine = {solved:G.solved, time:G.spent};
  if(!best || mine.solved > best.solved || (mine.solved === best.solved && mine.time < best.time)){
    best = mine;
    localStorage.setItem('testimony_record', JSON.stringify(best));
  }
  $('resultCard').innerHTML = `
    <h2 style="color:${busted?'var(--bad)':'var(--good)'}">${busted ? t('busted') : t('cleared')}</h2>
    <div class="big">${t('solvedN', G.solved, CONFIG.TOTAL_CASES)}</div>
    <p style="text-align:center">${t('totalTime')} ${mmss(G.spent)}</p>
    <p style="text-align:center">${t('best')} — ${t('recordLine', best.solved, CONFIG.TOTAL_CASES, mmss(best.time))}</p>
    <div style="margin-top:16px"></div>`;
  $('resultCard').appendChild(mkBtn(t('retry'), 'btn primary', ()=>{
    $('resultOv').classList.add('hidden'); newGame();
  }));
  $('resultOv').classList.remove('hidden');
}

/* ─── 도움말 · 타이틀 ─── */
function showHelp(){
  if(G) G.paused = true;              // 규칙 읽는 동안은 시계를 멈춘다
  $('helpCard').innerHTML = `<h2>${t('howto')}</h2>
    <ul class="rules">${t('rules').map(r=>`<li>${r}</li>`).join('')}</ul>
    <div style="margin-top:12px"></div>`;
  $('helpCard').appendChild(mkBtn(t('close'), 'btn', ()=>{
    $('helpOv').classList.add('hidden');
    if(G) G.paused = false;
  }));
  $('helpOv').classList.remove('hidden');
}
function showTitle(){
  let best = null;
  try{ best = JSON.parse(localStorage.getItem('testimony_record')); }catch(e){}
  $('titleCard').innerHTML = `
    <h2 style="font-size:30px;letter-spacing:.12em">${t('title')}</h2>
    <p style="margin-bottom:14px">${t('subtitle')}</p>
    <ul class="rules">${t('rules').map(r=>`<li>${r}</li>`).join('')}</ul>
    ${best?`<p style="text-align:center;margin-top:10px">${t('best')} — ${t('recordLine', best.solved, CONFIG.TOTAL_CASES, mmss(best.time))}</p>`:''}
    <div style="margin-top:14px"></div>`;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px';
  row.append(
    mkBtn(LANG==='ko'?'EN':'한', 'btn', ()=>{ LANG = LANG==='ko'?'en':'ko'; showTitle(); }),
    mkBtn(t('start'), 'btn primary', ()=>{ $('titleOv').classList.add('hidden'); newGame(); })
  );
  row.children[0].style.flex = '0 0 60px';
  $('titleCard').appendChild(row);
  $('titleOv').classList.remove('hidden');
}

$('helpBtn').onclick = showHelp;
$('langBtn').onclick = ()=>{ LANG = LANG==='ko'?'en':'ko'; render(); };
showTitle();
</script>
